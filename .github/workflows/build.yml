# Runs the tests and builds the Android app on every push. The debug APK can be downloaded from
# the run's "Artifacts" section and installed on a phone.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Game tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the game (no Android SDK needed)
        run: ./gradlew -p tools/desktop-build :core:test --console=plain

  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the "Latest build" release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The test APK (debug), plus the store version (release) to make sure it builds too.
      - name: Build the APKs
        run: ./gradlew :android:assembleDebug :android:assembleRelease :android:writeUpdateInfo --console=plain
      # Without libGDX's native libraries the app closes the moment it starts, so make sure every
      # phone architecture has them, along with the game's sounds, music and fonts.
      - name: Check the APK contents
        run: |
          apk=$(ls android/build/outputs/apk/debug/*.apk)
          unzip -l "$apk" > apk-contents.txt
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            for lib in libgdx.so libgdx-box2d.so libgdx-freetype.so; do
              grep -q "lib/$abi/$lib" apk-contents.txt || { echo "Missing lib/$abi/$lib"; exit 1; }
            done
          done
          for asset in music/match.ogg sounds/splat.wav fonts/TitanOne-Regular.ttf; do
            grep -q "assets/$asset" apk-contents.txt || { echo "Missing assets/$asset"; exit 1; }
          done
          grep -E "lib/|assets/music" apk-contents.txt
          ls -l "$apk"
      # Test builds update themselves from GitHub; Google Play doesn't allow that, so the store build
      # must ask for neither internet access nor permission to install apps.
      - name: Check only the test build can update itself
        run: |
          manifest() { { unzip -p "$1" AndroidManifest.xml | strings -e l; unzip -p "$1" AndroidManifest.xml | strings; } > "$2"; }
          manifest android/build/outputs/apk/debug/*.apk debug-manifest.txt
          manifest android/build/outputs/apk/release/*.apk release-manifest.txt
          grep -q REQUEST_INSTALL_PACKAGES debug-manifest.txt || { echo "The test build can't install its updates"; exit 1; }
          if grep -E "REQUEST_INSTALL_PACKAGES|permission.INTERNET" release-manifest.txt; then
            echo "The store build must not be able to install updates or go online"; exit 1
          fi
          cat android/build/outputs/update-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: pawtillery-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # Keeps one release, "Latest build", with the newest APK from main, so there is always a
      # direct link that installs on a phone:
      # https://github.com/<owner>/<repo>/releases/download/latest-build/pawtillery.apk
      - name: Publish the APK as the "Latest build" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/build/outputs/apk/debug/*.apk pawtillery.apk
          # update.json: installed test builds read it to find out about this one.
          python3 - <<'PY'
          import json, os, subprocess
          info = json.load(open("android/build/outputs/update-info.json"))
          info["apk"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/latest-build/pawtillery.apk"
          info["notes"] = subprocess.check_output(["git", "log", "-1", "--format=%s"], text=True).strip()
          json.dump(info, open("update.json", "w"), indent=2)
          PY
          cat update.json
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build pawtillery.apk update.json --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Test build of Pawtillery from commit $GITHUB_SHA. Open pawtillery.apk on an Android phone (8.0 or newer) to install it."
