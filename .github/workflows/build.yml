# Runs the tests and builds the Android app on every push. The debug APK can be downloaded from
# the run's "Artifacts" section and installed on a phone.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Game tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the game (no Android SDK needed)
        run: ./gradlew -p tools/desktop-build :core:test --console=plain

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug APK
        run: ./gradlew :android:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: pawtillery-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
